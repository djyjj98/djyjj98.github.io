<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minjeong Kim | Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Minjeong Kim</h1>
      <nav aria-label="Primary navigation">
        <ul>
          <li><a href="#about">About Me</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button id="theme-toggle" type="button">Toggle Dark Mode</button>
    </div>
  </header>

  <main class="container">
    <section id="about">
      <h2>About Me</h2>
      <p id="introduction">Hello! I am a Web and Digital Design student with experience in HTML, CSS, JavaScript, WordPress, and Adobe Creative Cloud.</p>
      <button id="edit-intro" type="button">Edit Introduction</button>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="project-list"></div>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul id="skill-list"></ul>
      <div class="skill-inputs">
        <input id="new-skill" type="text" placeholder="Skill name">
        <input id="skill-level" type="number" min="0" max="100" placeholder="Level 0–100">
        <button id="add-skill" type="button">Add Skill</button>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form">
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email:</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="portfolio.js"></script>
</body>
</html>
