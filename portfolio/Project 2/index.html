<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="css/styles.css">

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

label{
    display:inline-block;
    width:150px;
    margin-top:10px;
}

.error{
    color:red;
    font-weight:bold;
}

textarea{
    width:300px;
    height:100px;
}
</style>
</head>

<body>

<h1>Registration Form</h1>

<div id="errorMessages" class="error"></div>

<form id="registrationForm">

<label for="firstName">First Name*</label>
<input type="text" id="firstName" name="firstName" value="Enter First Name">
<br>

<label for="lastName">Last Name*</label>
<input type="text" id="lastName" name="lastName" value="Enter Last Name">
<br>

<label for="address">Address*</label>
<input type="text" id="address" name="address">
<br>

<label for="city">City*</label>
<input type="text" id="city" name="city">
<br>

<label for="state">State*</label>
<select id="state" name="state">
    <option value="">--Select--</option>
    <option>AL</option>
    <option>AK</option>
    <option>AZ</option>
    <option>AR</option>
    <option>CA</option>
    <option>CO</option>
    <option>CT</option>
    <option>DE</option>
    <option>FL</option>
    <option>GA</option>
    <option>HI</option>
    <option>ID</option>
    <option>IL</option>
    <option>IN</option>
    <option>IA</option>
    <option>KS</option>
    <option>KY</option>
    <option>LA</option>
    <option>ME</option>
    <option>MD</option>
    <option>MA</option>
    <option>MI</option>
    <option>MN</option>
    <option>MS</option>
    <option>MO</option>
    <option>MT</option>
    <option>NE</option>
    <option>NV</option>
    <option>NH</option>
    <option>NJ</option>
    <option>NM</option>
    <option>NY</option>
    <option>NC</option>
    <option>ND</option>
    <option>OH</option>
    <option>OK</option>
    <option>OR</option>
    <option>PA</option>
    <option>RI</option>
    <option>SC</option>
    <option>SD</option>
    <option>TN</option>
    <option>TX</option>
    <option>UT</option>
    <option>VT</option>
    <option>VA</option>
    <option>WA</option>
    <option>WV</option>
    <option>WI</option>
    <option>WY</option>
</select>
<br>

<label for="zip">Zip Code*</label>
<input type="text" id="zip" name="zip">
<br>

<label>Phone*</label>
<input type="text" id="areaCode" size="3" maxlength="3">
<input type="text" id="phoneNumber" size="7" maxlength="7">
<br>

<label for="email">E-mail*</label>
<input type="text" id="email">
<br>

<label for="confirmEmail">Confirm E-mail*</label>
<input type="text" id="confirmEmail">
<br><br>

<label>Meal Preference*</label>

<input type="radio" name="meal" value="Vegan"> Vegan

<input type="radio" name="meal" value="Vegetarian"> Vegetarian

<input type="radio" name="meal" value="Non-Vegetarian"> Non-Vegetarian
<br><br>

<label>Contact Method*</label>

<input type="checkbox" name="contact" value="Phone"> Phone

<input type="checkbox" name="contact" value="Email"> Email

<input type="checkbox" name="contact" value="Mail"> Mail

<input type="checkbox" name="contact" value="LinkedIn"> LinkedIn
<br><br>

<label for="comments">Comments</label>
<textarea id="comments" maxlength="250"></textarea>

<br><br>

<button type="submit">Submit</button>
<button type="reset">Reset</button>

</form>

<script src="js/project2.js"></script>

</body>
</html>
